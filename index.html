<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Card - Arun Dabi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }
        .card {
            width: 350px;
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .card h2 {
            margin: 10px 0 5px;
        }
        .card h4 {
            margin: 0;
            color: #555;
        }
        .icons a {
            margin: 10px;
            font-size: 24px;
            color: #333;
            text-decoration: none;
            transition: 0.3s;
        }
        .icons a:hover {
            color: #0077b5;
        }
        .summary {
            margin-top: 15px;
            color: #444;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Arun Dabi</h2>
        <h4>Web Developer</h4>

        <div class="icons">
            <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        </div>

        <p class="summary">
            Passionate Web Developer skilled in creating responsive and user-friendly websites.
            Focused on clean code, modern UI designs, and continuous learning.
        </p>
    </div>
</body>
</html>
